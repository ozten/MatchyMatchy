[package]
name = "matchy-analyze"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "matchy"
path = "src/bin/matchy.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
jsonschema = "0.18"
tempfile = "3"
